<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 16px;
      color: #1c1c1e;
    }
    .roku-card {
      background: #f8f7fa;
      border: 1px solid #e2dce8;
      border-radius: 12px;
      padding: 20px;
      margin-top: 8px;
    }
    h1 {
      font-size: 20px;
      font-weight: 600;
      margin: 0 0 8px 0;
      color: #662D91;
    }
    p.subtitle {
      font-size: 14px;
      color: #555;
      margin: 0 0 20px 0;
      line-height: 1.4;
    }
    .field {
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
      color: #333;
    }
    input[type="text"],
    input[type="number"] {
      width: 100%;
      box-sizing: border-box;
      padding: 10px 12px;
      font-size: 15px;
      border: 1px solid #ccc;
      border-radius: 8px;
      outline: none;
    }
    input:focus {
      border-color: #662D91;
    }
    .btn {
      display: inline-block;
      width: 100%;
      padding: 12px 16px;
      background: #662D91;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      text-align: center;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      box-sizing: border-box;
    }
    .btn:disabled {
      opacity: 0.6;
      cursor: default;
    }
    .error-banner {
      display: none;
      background: #fff1f0;
      border: 1px solid #ffa39e;
      color: #cf1322;
      padding: 12px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 16px;
      line-height: 1.45;
    }
  </style>
</head>
<body>
  <div class="roku-card">
    <h1 data-i18n="pair.manual_ip.title">Add Roku Manually</h1>
    <p class="subtitle" data-i18n="pair.manual_ip.subtitle">
      Enter the IP address of your Roku TV or Streaming Player if automatic discovery did not find it.
    </p>

    <div id="error-box" class="error-banner"></div>

    <div class="field">
      <label for="host-input" data-i18n="pair.manual_ip.host_label">IP Address</label>
      <input id="host-input" type="text" placeholder="192.168.1.100" autocomplete="off" />
    </div>

    <div class="field">
      <label for="port-input" data-i18n="pair.manual_ip.port_label">ECP Port</label>
      <input id="port-input" type="number" value="8060" min="1" max="65535" />
    </div>

    <button id="connect-btn" class="btn" data-i18n="pair.manual_ip.connect_button">Connect to Roku</button>
  </div>

  <script type="text/javascript">
    (function () {
      const hostInput = document.getElementById('host-input');
      const portInput = document.getElementById('port-input');
      const connectBtn = document.getElementById('connect-btn');
      const errorBox = document.getElementById('error-box');

      function showError(msg) {
        errorBox.textContent = msg;
        errorBox.style.display = 'block';
      }

      connectBtn.addEventListener('click', function () {
        errorBox.style.display = 'none';
        const host = (hostInput.value || '').trim();
        const port = parseInt(portInput.value, 10) || 8060;

        if (!host) {
          showError('Please enter a valid IPv4 address or hostname.');
          return;
        }

        connectBtn.disabled = true;
        Homey.showLoadingOverlay();

        Homey.emit('manual_connect', { host: host, port: port })
          .then(function () {
            Homey.hideLoadingOverlay();
            connectBtn.disabled = false;
            Homey.showView('verify_device');
          })
          .catch(function (err) {
            Homey.hideLoadingOverlay();
            connectBtn.disabled = false;
            showError(err && err.message ? err.message : String(err));
          });
      });
    })();
  </script>
</body>
</html>
